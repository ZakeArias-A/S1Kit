[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s1kit"
version = "0.0.1"
description = "System One on your model: direct decision tools for PyTorch models"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["pytorch", "inference", "classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
transformers = ["transformers>=5.17,<5.18", "Pillow>=10.1"]
qwen = ["transformers>=5.17,<5.18", "Pillow>=10.1", "accelerate>=1.10,<2", "bitsandbytes>=0.49,<1"]
cpu = ["torch>=2.6,<3"]
cu130 = ["torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "transformers>=5.17,<5.18", "Pillow>=10.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
